<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="preload"
      href="%PUBLIC_URL%/theme.min.css"
      data-hs-appearance="default"
      as="style"
    />
    <script src="%PUBLIC_URL%/bootstrap.bundle.min.js"></script>
    <script src="%PUBLIC_URL%/front-dashboard.js"></script>
    <link rel="stylesheet" href="%PUBLIC_URL%/main.css"/>
    <script src="%PUBLIC_URL%/hs.theme-appearance.js"></script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="content container" >
      <div class="row justify-content-center mt-3">
        <div class="col-9">
          <div
            class="card"
            style="
              min-height: 700px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
            "
          >
            <br />
            <div id="react-app" data-user-id="5" data-qid="d2f60f51-60d5-4fa1-9627-31279b3841f4" data-url="http://127.0.0.1:8000/"></div>
            <div class="card-body" style="width: 100%">
              <div
                id="root"
                style="
                  max-height: 650px;
                  overflow-y: auto;
                  width: 100%;
                  scrollbar-width: thin;
                "
              ></div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </body>
</html>
