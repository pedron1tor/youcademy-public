{% load static %}
<header id="header" class="navbar navbar-expand-lg navbar-fixed-lg navbar-light" style="background: linear-gradient(to right, 
                transparent 25px, 
                #DDDDDD 25px, 
                #DDDDDD calc(100% - 25px), 
                transparent calc(100% - 25px)
    ) bottom/100% 2px no-repeat;">
  <div class="container">
    <div class="navbar-nav-wrap mt-2 mb-2 d-flex justify-content-between align-items-center" >
      <a class="navbar-brand" href="{% url 'student_home' %}" aria-label="Front" style="
          display: inline-block;
          padding: 6px 10px;
          background-color: #FFFFFF: 
          {% comment %} #D9D9D9; {% endcomment %}
          border: 1px solid #ccc;
          border-radius: 9999px;
          text-decoration: none;
          color: #333;
          transition: background-color 0.3s ease;">
        <img class="navbar-brand-logo" src="{% static 'youcademy.svg' %}" alt="Logo" data-hs-theme-appearance="default" style="
            height: 40px;
            width: auto;
            vertical-align: middle;">
        <img class="navbar-brand-logo" src="{% static 'youcademy.svg' %}" alt="Logo" data-hs-theme-appearance="dark" style="
            height: 30px;
            width: auto;
            vertical-align: middle;">
      </a>
      
      <!-- New centered buttons -->
      {%url "student_home" as dashboard%}
      <div class="d-flex justify-content-center" style="flex-grow: 1;">
        <a href="{%url 'student_home' %}" class="btn mx-2" style="
          padding: 8px 24px;
          background-color: {%if request.path == dashboard %}#000000{%else%}#FFFFFF {%endif%};
          color: {%if request.path == dashboard %}#FFFFFF{%else%} #000000{%endif%};
          border-radius: 9999px;
          text-decoration: none;
          transition: background-color 0.3s ease;">
          Dashboard
        </a>
        <a href="{%url "student_courses"%}" class="btn mx-2" style="
          padding: 8px 24px;
          background-color: 
                  {% if request.path == '/student/courses' %}#000000
                  {% else %}#FFFFFF
                  {% endif %};
          color: 
                {% if request.path == '/student/courses' %}#FFFFFF
                {% else %}#000000
                {% endif %};
          border-radius: 9999px;
          text-decoration: none;
          transition: background-color 0.3s ease;">
          Courses
        </a>
        <a href="" class="btn mx-2" style="
          padding: 8px 24px;
          background-color: {% if request.path == dashboard %}#FFFFFF
                  {% elif request.path == '/student/courses' %}#FFFFFF
                  {% elif request.path == '/student/grades/' %}
                  #FFFFFF
                  {% else %}#000000
                  {% endif %};
          color: {% if request.path == dashboard %}#000000
                {% elif request.path == '/student/courses' %}#000000
                {%elif request.path == '/student/grades/'%}
                #000000
                {% else %}#FFFFFF
                {% endif %};
          border-radius: 9999px;
          text-decoration: none;
          transition: background-color 0.3s ease;">
          Learning Plan
        </a>
        <a href="{%url "grades"%}" class="btn mx-2" style="
          padding: 8px 24px;
          background-color: {% if request.path == '/student/grades/' %}#000000
                  {% else %}#FFFFFF
                  {% endif %};
          color: {% if request.path == '/student/grades/' %}#FFFFFF
                {% else %}#000000
                {% endif %};
          border-radius: 9999px;
          text-decoration: none;
          transition: background-color 0.3s ease;">
          Grades
        </a>
        <a href="" class="btn mx-2" style="
          padding: 8px 24px;
          background-color: #FFFFFF ;
          color: #000000;
          border-radius: 9999px;
          text-decoration: none;
          transition: background-color 0.3s ease;">
          Information
        </a>
      </div>

      <div class="navbar-nav-wrap-content-end">
        <ul class="navbar-nav">
          <li class="nav-item d-none d-md-inline-block">
          <li class="nav-item">
            <div class="dropdown">
              <a class="navbar-dropdown-account-wrapper" href="javascript:;" id="accountNavbarDropdown" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside" data-bs-dropdown-animation>
                <div class="avatar avatar-sm avatar-circle" style="width:3rem; height: 3rem; position: relative; display: inline-block; font-size: 0.875rem; border-radius: 50%;">
                  <img class="avatar-img" src="{% static "blankpp.jpg" %}" alt="Image Description" style="border: 1px solid #DDDDDD; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                </div>
              </a>
              <div class="dropdown-menu dropdown-menu-end navbar-dropdown-menu navbar-dropdown-menu-borderless navbar-dropdown-account" aria-labelledby="accountNavbarDropdown" style="width: 16rem;">
                <div class="dropdown-item-text">
                  <div class="d-flex align-items-center">
                    <div class="avatar avatar-sm avatar-circle">
                      <img class="avatar-img" src="{% static "blankpp.jpg" %}" alt="Image Description">
                    </div>
                    <div class="flex-grow-1 ms-3">
                      <h5 class="mb-0">{{user.name}}</h5>
                    </div>
                  </div>
                </div>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="{%url "edit_profile"%}">Profile &amp; account</a>
                <a class="dropdown-item" href="#">Settings</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="/pages/logout">Sign out</a>
              </div>
            </div>
            <!-- End Account -->
          </li>
        </ul>
        <!-- End Navbar -->
      </div>
    </div>
  </div>
</header>
{% include "messages.html"%}
