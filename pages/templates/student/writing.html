{% extends 'new_writing_layout.html' %}
{% load static %}
{% block head %}
<!-- Additional head specific to writing.html -->
<meta name="csrf-token" content="{{ csrf_token }}">
<style>
  .chat-toggle {
      position: absolute;
      top: 90px;
      right: 10px;
      z-index: 1000;
      transform-origin: right bottom;

  }
  .chat-container {
      transition: all 0.3s ease;
  }
  .flex.flex-col.space-y-4.border-t.border-gray-200.bg-gray-50.p-7.sm\:p-10 {
    background-color: #FAFAFA !important;
  }
</style>
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5 " style="background-color:#FFFFFF;">
    <div id="root"class="col-8">
        
    </div>
    
    <div id="chatColumn"class="col-4">
      <button id="chatToggle" class="chat-toggle" style="
      padding: 4px 24px;
      background-color: #FFFFFF;
      color: #000000;
      text-decoration: none;
      transition: background-color 0.3s ease;">Chat</button>
        <div class="card" style="min-height: 700px; position: relative;">
          
            <div class="chat-container" style="padding: 0; height: 100%; border-radius: 15px; overflow: hidden;">
                <div id="root2" style="height: 700px; overflow-y: auto; border-radius: 15px;">
                    <!-- Your chat content here -->
                </div>
            </div>
        </div>
    </div>
</div>

<div id="react-app" data-user-id="{{ user_id }}" data-qid="{{ qid }}" data-url="{{ data_url }}" data-wsurl="{{ ws_url }}"></div>
<div id="react-app2" data-user-id="{{ user_id }}" data-qid="{{ qid }}" data-url="{{ data_url }}" data-wsurl="{{ ws_url }}" data-occupation="student" data-prompt="{{ prompt }}"></div>

{% endblock %}

    {% block scripts %}
    <script>
      const chatToggle = document.getElementById('chatToggle');
      const chatColumn = document.getElementById('chatColumn');
      const mainContent = document.getElementById('root');

      let isChatOpen = true;

      chatToggle.addEventListener('click', () => {
          if (isChatOpen) {
              chatColumn.style.width = '0';
              chatColumn.style.padding = '0';
              mainContent.className = 'col-12';
              chatToggle.textContent = 'Open';
          } else {
              chatColumn.style.width = '33.333%';
              chatColumn.style.padding = '0 15px';
              mainContent.className = 'col-8';
              chatToggle.textContent = 'Chat';
          }
          isChatOpen = !isChatOpen;
      });
  </script>
    <script type="text/javascript">
        // Create a JavaScript variable from the Django context variable
        const userId = '{{ user_id }}';
        const qid = '{{ qid }}';
        const url = '{{ data_url }}';
        window.addEventListener('beforeunload', function (e) {
            const data = new FormData();
            data.append('user_id', userId);
            data.append('qid', qid);
            // Send the user ID with navigator.sendBeacon
            navigator.sendBeacon('/api/user-left/', data);
        });
    </script>

    <script src="{% static 'react2/static/js/main.ab65509f.js' %}"></script>
    <script src="{% static 'react/static/js/main.71d4a2c7.js' %}"></script>
    {% endblock %}
